<div class="table-container">
  <!-- Filter Input -->
  <mat-form-field appearance="outline">
    <mat-label>Filter</mat-label>
    <input matInput (input)="applyFilter($event)" placeholder="Filter..." />
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" matSort  (matSortChange)="sortData($event)">
    <!-- Framework Column -->
    <ng-container matColumnDef="framework">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
          [ngClass]="{'sticky-column': isSticky('framework')}"
          [ngStyle]="isSticky('framework') ? {'left.px': getStickyLeft('framework')} : {}">
        Framework
      </th>
      <td mat-cell *matCellDef="let element">{{ element.framework }}</td>
    </ng-container>

     <!-- version Column -->
     <ng-container matColumnDef="version">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
          [ngClass]="{'sticky-column': isSticky('version')}"
          [ngStyle]="isSticky('version') ? {'left.px': getStickyLeft('version')} : {}">
          Version
      </th>
      <td mat-cell *matCellDef="let element">{{ element.version }}</td>
    </ng-container>

     <!-- Control ID Column -->
     <ng-container matColumnDef="controlId">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
          [ngClass]="{'sticky-column': isSticky('controlId')}"
          [ngStyle]="isSticky('controlId') ? {'left.px': getStickyLeft('controlId')} : {}">
        Control ID
      </th>
      <td mat-cell *matCellDef="let element">{{ element.controlId }}</td>
    </ng-container>

        <!-- Control Name Column -->
        <ng-container matColumnDef="controlName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header
              [ngClass]="{'sticky-column': isSticky('controlName')}"
              [ngStyle]="isSticky('controlName') ? {'left.px': getStickyLeft('controlName')} : {}">
            Control Name
          </th>
          <td mat-cell *matCellDef="let element">{{ element.controlName }}</td>
        </ng-container>


         <!-- Control Description Column -->
    <ng-container matColumnDef="controlDescription">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
          [ngClass]="{'sticky-column': isSticky('controlDescription')}"
          [ngStyle]="isSticky('controlDescription') ? {'left.px': getStickyLeft('controlDescription')} : {}">
        Control Description
      </th>
      <td mat-cell *matCellDef="let element">{{ element.controlDescription }}</td>
    </ng-container>

    <!-- Category Column -->
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef mat-sort-header
          [ngClass]="{'sticky-column': isSticky('category')}"
          [ngStyle]="isSticky('category') ? {'left.px': getStickyLeft('category')} : {}">
        Category
      </th>
      <td mat-cell *matCellDef="let element">{{ element.category }}</td>
    </ng-container>

    <!-- Table Footer with Paginator -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [length]="data.length" [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"></mat-paginator>
</div>
