   <div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100 shadow rounded overflow-hidden" style="max-width: 900px;">
      
      <!-- Left side: Login Form -->
      <div class="col-md-6 bg-white p-5 d-flex flex-column justify-content-center">
        <h2 class="text-danger fw-bold mb-4 text-center">ESTUATE</h2>
        <h5 class="mb-4 text-center">Login into your account</h5>
  
        <form>
          <div class="mb-3">
            <label for="email" class="form-label">User Login</label>
            <input type="email" id="email" class="form-control" placeholder="abc@email.com">
          </div>
  
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="Enter your password">
          </div>
  
          <div class="text-end mb-3">
            <a href="#" class="text-danger small">Forgot password?</a>
          </div>
  
          <div class="d-grid">
            <button type="submit" (click)="login()" class="btn btn-danger">Sign In</button>
          </div>
        </form>
      </div>
  
      <!-- Right side: Image and Text -->
      <div class="col-md-6 bg-danger text-white p-5 d-flex flex-column justify-content-center text-center">
        <h3>Control Harmonization</h3>
        <p class="mt-3">
          Your gateway to a secure and synchronized system<br>
          where control meets clarity
        </p>
        <div class="image-wrapper">
          <img src="../../assets/log-in-image.png" alt="Hub Icon" style="max-width: 150px;">
        </div>
        <h5 class="mt-2">HUB</h5>
      </div>
  
    </div>
  </div>
